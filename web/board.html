<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>jalur-agent</title>
<style>
:root{--ground:#E9ECEF;--surface:#FFFFFF;--ink:#15181D;--muted:#5F6875;--line:#D7263D;--rail:#C5CBD3;
--q:#1F6FEB;--s:#1A9E5B;--soft:#F4F6F8;
--disp:"Bahnschrift","DIN Alternate","Segoe UI",sans-serif;--mono:"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--disp);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:20px 40px}
.badge{width:44px;height:44px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.title{flex:1}.title b{display:block;font-size:20px;font-weight:600}.title span{font-size:13px;color:var(--muted)}
.sim{font-size:13px;color:var(--muted);border:1px dashed var(--rail);padding:4px 10px;border-radius:4px}
button{font:600 15px var(--disp);border:2px solid var(--ink);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid var(--line);outline-offset:3px}
main{flex:1;display:grid;grid-template-columns:1fr 360px;gap:24px;padding:8px 40px 40px}
.stage{background:var(--surface);border-radius:16px;padding:36px 48px 28px;display:grid;grid-template-rows:auto 1fr auto;gap:28px}
.map{align-self:center}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px}
.now small{font-size:15px;color:var(--muted);display:block;margin-bottom:6px}
.now h2{font-size:56px;font-weight:700;margin:0;line-height:1.05}
.stats{display:flex;gap:28px}
.stat b{display:block;font-size:36px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:13px;color:var(--muted)}

/* middle: what this station is doing + transfer card */
.mid{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.acts{background:var(--soft);border-radius:12px;padding:20px 24px;overflow:hidden}
.acts h4,.xfer h4{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--muted)}
.act{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid #E1E5EA;animation:in .35s ease}
.act:first-of-type{border-top:0}
.kind{width:64px;flex:none;font:600 12px var(--mono);text-align:center;padding:5px 0;border-radius:4px;background:var(--ink);color:#fff}
.act .msg{font-size:18px}
.why{font-size:16px;line-height:1.45;margin:-4px 0 14px;color:var(--ink);max-width:70ch}
.act.latest .msg{font-weight:600}
.act:not(.latest){opacity:.55}
.xfer{border-radius:12px;padding:20px 24px;border:2px dashed var(--rail);display:flex;flex-direction:column;gap:14px;transition:.3s}
.hist{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted)}
.hist div{display:flex;align-items:center;gap:8px}.hist i{width:12px;height:12px;border-radius:50%;flex:none}
.recap{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 24px}
.rc{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #E1E5EA;font-size:15px}
.rc b{font:600 13px var(--mono);color:var(--muted)}
.xfer .who{display:flex;align-items:center;gap:12px}
.xfer .ln{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;background:var(--rail)}
.xfer .nm{font-size:20px;font-weight:600;line-height:1.2}.xfer .nm small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.xfer.on{border-style:solid}
.desc{font-size:15px;line-height:1.45;margin:0}.desc.m{color:var(--muted);font-size:14px}.desc b{font-weight:600}

/* map */
.map{position:relative;height:200px;margin:0 56px}
.rail,.fill{position:absolute;left:0;top:120px;height:10px;border-radius:5px}
.rail{right:0;background:var(--rail)}.fill{width:0;background:var(--line);transition:width .6s ease}
.st{position:absolute;top:125px;width:0;height:0}
.dot{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:5px solid var(--rail);transition:.4s;z-index:2}
.st.done .dot{border-color:var(--line)}
.st.done .dot::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--line)}
.st.active .dot{left:-20px;top:-20px;width:40px;height:40px;border:7px solid var(--line);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(215,38,61,.45)}70%{box-shadow:0 0 0 18px rgba(215,38,61,0)}100%{box-shadow:0 0 0 0 rgba(215,38,61,0)}}
.lab{position:absolute;left:0;top:30px;transform:translateX(-50%);width:130px;text-align:center;font-size:14px;color:var(--muted);line-height:1.25}
.lab i{display:block;font:12px var(--mono);font-style:normal;margin-bottom:2px}
.st.active .lab,.st.done .lab{color:var(--ink)}.st.active .lab{font-weight:700}
/* interchange branch going up */
.br{position:absolute;left:-5px;bottom:0;width:10px;height:0;border-radius:5px;transition:height .5s ease}
.br .ln{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;display:grid;place-items:center;opacity:0;transition:opacity .3s .3s}
.br.on{height:88px}.br.on .ln{opacity:1}
.br .tag{position:absolute;left:28px;top:-16px;white-space:nowrap;font-size:13px;color:var(--muted);opacity:0;transition:opacity .3s .4s}
.br.on .tag{opacity:1}

.board{background:var(--ink);color:#EDEFF2;border-radius:16px;padding:24px;display:flex;flex-direction:column;max-height:calc(100vh - 130px)}
.board h3{font-size:15px;font-weight:600;margin:0 0 16px;color:#AEB6C2}
.log{overflow:auto;flex:1}
.ev{display:grid;grid-template-columns:48px 62px 1fr;gap:10px;font:13px/1.45 var(--mono);padding:9px 0;border-top:1px solid #2A2F37;animation:in .35s ease}
.ev .t{color:#7E8896}.ev .k{color:#FFB547}
.ev.skill .k{color:#fff;background:var(--line);border-radius:3px;padding:0 6px;justify-self:start}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.empty{color:#7E8896;font-size:14px}
body.present main{grid-template-columns:1fr}body.present .board,body.present .sim{display:none}
body.present .now h2{font-size:76px}
@media (max-width:1200px){main{grid-template-columns:1fr}.board{max-height:320px}.mid{grid-template-columns:1fr}}
/* narrow windows: header wraps, stats wrap, station labels collapse to numbers (active one keeps its name) */
@media (max-width:900px){
 header{flex-wrap:wrap;padding:16px 20px;gap:10px}.title{flex:1 1 60%}
 header select{order:5;flex:1 1 100%}
 main{padding:8px 16px 24px}.stage{padding:24px 20px}
 .top{flex-direction:column;align-items:flex-start}
 .now h2{font-size:clamp(32px,8vw,56px)}
 .stats{flex-wrap:wrap;gap:16px 24px}.stat b{font-size:28px}
 .map{margin:0 18px}
 .lab{width:auto;font-size:0}.lab i{font-size:12px}
 .st.active .lab{font-size:13px;width:120px}
 .br .tag{display:none}
}
html,body{overflow-x:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.live{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--rail)}.live.on i{background:var(--s)}
select,input{font:15px var(--disp);border:2px solid var(--rail);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink)}
select:focus-visible,input:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.stats .stat.bad b{color:var(--line)}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.filters input{width:100%;background:#20252D;color:#EDEFF2;border-color:#2A2F37}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px var(--mono);padding:4px 9px;border-radius:999px;border:1px solid #3A414C;background:transparent;color:#AEB6C2;cursor:pointer}
.chip.on{background:#EDEFF2;color:var(--ink);border-color:#EDEFF2}
.ev{grid-template-columns:48px 62px 1fr auto}
.ev .d{font-size:12px;color:#7E8896;text-align:right;white-space:nowrap}
.ev.fail .d{color:#FF8A8A}
.ev.fail .k{color:#fff;background:var(--line);border-radius:3px;padding:0 6px;justify-self:start}
.rc b{white-space:nowrap}
.rc em{font-style:normal;color:var(--muted);font:12px var(--mono);margin-left:8px}
</style></head><body>
<header>
 <div class="badge" aria-hidden="true" id="badge">·</div>
 <div class="title"><b id="pname">jalur-agent</b><span id="psub"></span></div>
 <label class="live" id="live"><i></i><span id="liveT"></span></label>
 <select id="pipeSel" aria-label="Pipeline"></select>
 <select id="runSel" aria-label="Run"></select>
 <button class="ghost" id="lang"></button>
 <button class="ghost" id="pres"></button>
 <button id="play"></button>
</header>
<main>
 <section class="stage">
  <div class="top">
   <div class="now"><small id="kicker"></small><h2 id="cur"></h2></div>
   <div class="stats">
    <div class="stat"><b id="sT">0s</b><span data-t="duration"></span></div>
    <div class="stat"><b id="sE">0</b><span data-t="toolCalls"></span></div>
    <div class="stat"><b id="sF">0</b><span data-t="filesChanged"></span></div>
    <div class="stat"><b id="sS">0</b><span data-t="transfers"></span></div>
    <div class="stat" id="sXw"><b id="sX">0</b><span data-t="failed"></span></div>
   </div>
  </div>
  <div class="map" id="map"><div class="rail"></div><div class="fill" id="fill"></div></div>
  <div class="mid">
   <div class="acts"><h4 id="actsH"></h4><p class="why" id="why"></p><div id="acts"><div class="act latest"><span class="kind">—</span><span class="msg" id="hint"></span></div></div></div>
   <div class="xfer" id="xfer"><h4 id="xH"></h4>
    <div class="who"><div class="ln" id="xLn">·</div><div class="nm" id="xNm"></div></div>
    <p class="desc" id="xF"></p><p class="desc m" id="xM"></p>
    <div class="hist" id="hist"></div></div>
  </div>
 </section>
 <aside class="board"><h3 data-t="log"></h3>
  <div class="filters"><input id="q" type="search">
   <div class="chips" id="chips"></div></div>
  <div class="log" id="log"></div></aside>
</main>
<script>
// ---------- i18n ----------
const I18N={
 en:{departed:'Not departed',waiting:'Waiting for a run',hint:s=>`Invoke the skill "${s}" in Claude Code to start a run.`,station:(a,b)=>`Station ${a} of ${b}`,
  arrived:'Arrived',done:'Done',summary:'Journey summary',here:'At this station',transfer:'Transfer',mainSkill:'Main skill',what:'What',why:'Why',
  duration:'duration',toolCalls:'tool calls',filesChanged:'files changed',transfers:'transfers',failed:'failed',log:'Journey log',
  search:'Search the log (file, command, skill)',latest:'Latest run (live)',live:'Live',reconnect:'Reconnecting…',present:'Presentation mode',exitPresent:'Exit presentation',
  replay:'Replay',replaying:'Replaying…',skipped:'skipped',events:'events',noMatch:'No matching events.',noEvents:'No events yet.',noSkill:'No other skill called yet',
  failedShort:'failed',subagent:'Subagent',subagentWhat:'A separate agent that does part of the work and reports back to the main session.',
  chips:{all:'All',Skill:'Skill',Shell:'Shell',edit:'Edit/Write',read:'Read/Search',mcp:'MCP',fail:'Failed'},other:'Bahasa Indonesia',session:'session'},
 id:{departed:'Belum berangkat',waiting:'Nunggu sesi',hint:s=>`Panggil skill "${s}" di Claude Code buat mulai.`,station:(a,b)=>`Stasiun ${a} dari ${b}`,
  arrived:'Tiba di tujuan',done:'Selesai',summary:'Ringkasan perjalanan',here:'Di stasiun ini',transfer:'Transfer',mainSkill:'Skill utama',what:'Fungsi',why:'Biar',
  duration:'durasi',toolCalls:'tool call',filesChanged:'file diubah',transfers:'transfer',failed:'gagal',log:'Log perjalanan',
  search:'Cari di log (file, perintah, skill)',latest:'Sesi terbaru (live)',live:'Live',reconnect:'Nyambung ulang…',present:'Mode presentasi',exitPresent:'Keluar presentasi',
  replay:'Putar ulang',replaying:'Memutar…',skipped:'dilewati',events:'event',noMatch:'Nggak ada event yang cocok.',noEvents:'Belum ada event.',noSkill:'Skill lain belum dipanggil',
  failedShort:'gagal',subagent:'Subagent',subagentWhat:'Agent terpisah yang ngerjain sebagian tugas, terus balikin hasilnya ke sesi utama.',
  chips:{all:'Semua',Skill:'Skill',Shell:'Shell',edit:'Edit/Write',read:'Baca/Cari',mcp:'MCP',fail:'Gagal'},other:'English',session:'sesi'}};
const qs=new URLSearchParams(location.search);
let LANG=qs.get('lang')||localStorage.getItem('ja-lang')||((navigator.language||'').startsWith('id')?'id':'en');if(!I18N[LANG])LANG='en';
const T=k=>I18N[LANG][k];
const L=v=>v&&typeof v==='object'&&!Array.isArray(v)?(v[LANG]??v.en??Object.values(v)[0]):v; // pipeline strings may be {en,id}
const PIPE=qs.get('pipeline')||'feature-flow';

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const re=s=>s?new RegExp(s,'i'):null;
const AGENT='__agent';
let P,all=[],replayT=null,tick=null,shown=null,lastLog=[];
const flt={q:'',k:'all'};

// Pre/Post merge: each PreToolUse gets dur + ok from its PostToolUse (tool_use_id, else last open call of the same kind)
const openCalls=new Map();
function ingest(e){
 if(e.event==='PostToolUse'){
  let pre=e.tid&&openCalls.get(e.tid);
  if(!pre)for(let i=all.length-1;i>=0;i--){const x=all[i];if(x.event==='PreToolUse'&&x.session===e.session&&x.kind===e.kind&&x.dur==null){pre=x;break}}
  if(pre){pre.dur=e.dur??(e.ts-pre.ts);pre.ok=e.ok;if(pre.tid)openCalls.delete(pre.tid)}
  return}
 if(e.event==='PreToolUse'&&e.tid)openCalls.set(e.tid,e);
 all.push(e)}

// Runs: one per start-skill call; events of the same session until the next start in that session
const ADJ=['calm','swift','keen','bright','brisk','quiet','steady','tidy','nimble','bold'];
const NOUN=['heron','falcon','otter','lynx','orca','robin','tapir','gecko','ibis','marten'];
const nick=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return `${ADJ[(h>>>4)%ADJ.length]}-${NOUN[h%NOUN.length]}`};
function runs(){
 const out=[];
 all.forEach((e,i)=>{if(e.kind==='Skill'&&e.text===P.startSkill)out.push({i,session:e.session,ts:e.ts})});
 return out.map((r,k)=>{const next=out.slice(k+1).find(x=>x.session===r.session);
  return {...r,events:all.slice(r.i,next?next.i:all.length).filter(e=>e.session===r.session),
   name:`${new Date(r.ts).toLocaleString(LANG==='id'?'id-ID':'en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · ${nick(r.session+r.ts)}`}})}

function newState(t0){return{t0,phase:0,calls:0,files:new Set(),xf:[],per:P.steps.map(()=>0),phaseAt:P.steps.map(()=>null),acts:[],done:false,end:null,last:t0}}
function apply(S,e){
 if(!e.kind)return;S.last=e.ts;if(S.phaseAt[0]==null)S.phaseAt[0]=e.ts;
 if(e.event==='PreToolUse')S.calls++;
 for(const r of P.rules){
  if(r.from!=null&&S.phase<r.from)continue;
  if(!re(r.kind).test(e.kind))continue;
  if(r.text&&!re(r.text).test(e.text||''))continue;
  if(r.to>S.phase){S.acts=[];S.phase=r.to;S.phaseAt[r.to]=e.ts}
  break}
 S.per[S.phase]++;
 if(e.kind==='Edit'||e.kind==='Write')S.files.add((e.text||'').split(' ')[0]);
 if(e.kind==='Skill'&&P.transfers[e.text])S.xf.push({at:S.phase,id:e.text});
 if(e.kind==='Agent')S.xf.push({at:S.phase,id:AGENT,label:e.text});
 if(S.phase===P.steps.length-1&&e.kind==='Turn'){S.done=true;S.end=e.ts}
 if(e.kind!=='User'&&e.kind!=='Turn'){S.acts.push(e);if(S.acts.length>4)S.acts.shift()}}

const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return s<60?s+'s':Math.floor(s/60)+'m '+(s%60)+'s'};
const dfmt=ms=>ms==null?'…':ms<1000?ms+'ms':fmt(ms);
function phaseDur(S,j){const a=S.phaseAt[j];if(a==null)return null;let b=null;for(let k=j+1;k<S.phaseAt.length;k++)if(S.phaseAt[k]!=null){b=S.phaseAt[k];break}return (b??S.end??S.last)-a}
const xinfo=x=>x.id===AGENT?{...P.transfers[AGENT],name:T('subagent')+': '+(x.label||'')}:P.transfers[x.id];
const tm=ts=>new Date(ts).toLocaleTimeString(LANG==='id'?'id-ID':'en-GB',{hour:'2-digit',minute:'2-digit'});

function render(S,list){
 const n=P.steps.length;
 document.querySelectorAll('.st').forEach((el,j)=>el.className='st'+(j<S.phase||S.done?' done':j===S.phase?' active':''));
 $('fill').style.width=(S.done?100:S.phase/(n-1)*100)+'%';
 document.querySelectorAll('.br').forEach(b=>{b.className='br';b.style.background=''});
 S.xf.forEach(x=>{const I=xinfo(x),b=$('b'+x.at);b.classList.add('on');b.style.background=I.color;
  const ln=b.querySelector('.ln');ln.style.background=I.color;ln.textContent=I.letter;b.querySelector('.tag').textContent=I.name});
 if(S.done){$('kicker').textContent=T('arrived');$('cur').textContent=T('done');$('actsH').textContent=T('summary');$('why').textContent='';
  $('acts').innerHTML='<div class="recap">'+P.steps.map((s,j)=>`<div class="rc"><span>${esc(L(s))}</span><b>${S.per[j]} ${T('events')}<em>${S.phaseAt[j]!=null?fmt(phaseDur(S,j)):T('skipped')}</em></b></div>`).join('')+'</div>'}
 else{$('kicker').textContent=T('station')(S.phase+1,n);$('cur').textContent=L(P.steps[S.phase]);$('actsH').textContent=T('here');$('why').textContent=L((P.whys||[])[S.phase])||'';
  $('acts').innerHTML=S.acts.map((e,j)=>`<div class="act${j===S.acts.length-1?' latest':''}"><span class="kind">${esc(e.kind)}</span><span class="msg">${esc(e.text)}${e.dur!=null?` · ${dfmt(e.dur)}`:''}${e.ok===false?` · ${T('failedShort')}`:''}</span></div>`).join('')}
 const last=S.xf[S.xf.length-1];
 if(last){const I=xinfo(last);$('xfer').className='xfer on';$('xfer').style.borderColor=I.color;$('xLn').style.background=I.color;$('xLn').textContent=I.letter;
  $('xNm').innerHTML=`${esc(I.name)}<small>${esc(last.id===AGENT?'subagent':last.id)}</small>`;$('xH').textContent=T('transfer');setDesc(I);
  $('hist').innerHTML=S.xf.map(x=>{const J=xinfo(x);return `<div><i style="background:${esc(J.color)}"></i>${esc(T('station')(x.at+1,n))} → ${esc(J.name)}</div>`}).join('')}
 else mainCard();
 const fails=list.filter(e=>e.ok===false).length;
 $('sE').textContent=S.calls;$('sF').textContent=S.files.size;$('sS').textContent=S.xf.length;$('sX').textContent=fails;$('sXw').className='stat'+(fails?' bad':'');
 lastLog=list;renderLog()}
function mainCard(){const M=(P.skills||{})[P.startSkill]||{letter:P.badge,name:P.startSkill,color:'#D7263D'};
 $('xH').textContent=T('mainSkill');$('xfer').className='xfer on';$('xfer').style.borderColor=M.color;$('xLn').style.background=M.color;$('xLn').textContent=M.letter;
 $('xNm').innerHTML=`${esc(M.name)}<small>${esc(P.startSkill)}</small>`;setDesc(M);$('hist').innerHTML=''}
function setDesc(I){$('xF').innerHTML=I.fungsi?`<b>${T('what')}:</b> `+esc(L(I.fungsi)):'';$('xM').innerHTML=I.manfaat?`<b>${T('why')}:</b> `+esc(L(I.manfaat)):''}

function match(e){
 const k=flt.k;
 if(k==='fail'&&e.ok!==false)return false;
 if(k==='edit'&&!/^(Edit|Write)$/.test(e.kind))return false;
 if(k==='read'&&!/^(Read|Grep|Glob)$/.test(e.kind))return false;
 if(k==='mcp'&&/^(Skill|Shell|Read|Edit|Write|Grep|Glob|Agent|User|Turn|TodoWrite|ToolSearch|WebFetch|WebSearch)$/.test(e.kind))return false;
 if(!['all','fail','edit','read','mcp'].includes(k)&&e.kind!==k)return false;
 if(flt.q&&!(`${e.kind} ${e.text||''}`).toLowerCase().includes(flt.q))return false;
 return true}
function renderLog(){
 const rows=lastLog.filter(match).slice().reverse().slice(0,300);
 $('log').innerHTML=rows.map(e=>`<div class="ev ${e.kind==='Skill'?'skill':''}${e.ok===false?' fail':''}"><span class="t">${tm(e.ts)}</span><span class="k">${esc(e.kind)}</span><span>${esc(e.text)}</span><span class="d">${e.event==='PreToolUse'?(e.ok===false?T('failedShort')+' · ':'')+dfmt(e.dur):''}</span></div>`).join('')||`<div class="empty">${lastLog.length?T('noMatch'):T('noEvents')}</div>`}

function current(){const R=runs();return shown!=null?R.find(r=>String(r.i)===shown):R[R.length-1]}
function fillRuns(){const R=runs(),sel=$('runSel'),v=sel.value;
 sel.innerHTML=`<option value="">${esc(T('latest'))}</option>`+R.slice().reverse().map(r=>`<option value="${r.i}">${esc(r.name)}</option>`).join('');sel.value=v}
function liveRender(){
 if(replayT)return;const r=current();
 if(!r){$('cur').textContent=T('waiting');$('kicker').textContent=T('departed');$('hint').textContent=T('hint')(P.startSkill);mainCard();lastLog=[];renderLog();return}
 const S=newState(r.ts);r.events.forEach(e=>apply(S,e));window.__run=S;
 $('psub').textContent=`${r.name} · ${T('session')} ${r.session}`;render(S,r.events)}
function startTick(){clearInterval(tick);tick=setInterval(()=>{const S=window.__run;if(S&&!replayT)$('sT').textContent=fmt((S.end||(shown!=null?S.last:Date.now()))-S.t0)},1000)}

// ---------- static texts ----------
function texts(){
 document.documentElement.lang=LANG;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T(el.dataset.t));
 $('q').placeholder=T('search');$('q').setAttribute('aria-label',T('search'));
 $('lang').textContent=T('other');$('play').textContent=T('replay');
 $('pres').textContent=document.body.classList.contains('present')?T('exitPresent'):T('present');
 $('liveT').textContent=$('live').classList.contains('on')?T('live'):T('reconnect');
 $('chips').innerHTML=Object.entries(T('chips')).map(([k,l])=>`<button class="chip${k===flt.k?' on':''}" data-k="${k}">${esc(l)}</button>`).join('')}

// ---------- boot ----------
fetch('/pipeline/'+encodeURIComponent(PIPE)).then(r=>{if(!r.ok)throw new Error('pipeline');return r.json()}).then(p=>{P=p;
 P.transfers=Object.fromEntries(Object.entries(P.skills||{}).filter(([k])=>k!==P.startSkill));
 P.transfers[AGENT]={letter:'A',name:T('subagent'),color:'#5F6875',fungsi:T('subagentWhat')};
 $('pname').textContent=L(P.name);$('badge').textContent=P.badge||'·';document.title=L(P.name)+' · jalur-agent';
 P.steps.forEach((s,i)=>$('map').insertAdjacentHTML('beforeend',`<div class="st" style="left:${i/(P.steps.length-1)*100}%"><div class="br" id="b${i}"><div class="ln"></div><span class="tag"></span></div><div class="dot"></div><div class="lab"><i>${String(i+1).padStart(2,'0')}</i>${esc(L(s))}</div></div>`));
 texts();
 const es=new EventSource('/events');let ready=false;
 es.onopen=()=>{$('live').className='live on';$('liveT').textContent=T('live')};
 es.onerror=()=>{$('live').className='live';$('liveT').textContent=T('reconnect')};
 es.addEventListener('ready',()=>{ready=true;fillRuns();liveRender()});
 es.onmessage=m=>{try{ingest(JSON.parse(m.data))}catch(_){}if(ready){fillRuns();liveRender()}};
 startTick();
}).catch(()=>{texts();$('cur').textContent='Pipeline "'+PIPE+'" not found';});
fetch('/pipelines').then(r=>r.json()).then(names=>{$('pipeSel').innerHTML=names.map(n=>`<option${n===PIPE?' selected':''}>${esc(n)}</option>`).join('');if(names.length<2)$('pipeSel').style.display='none'}).catch(()=>{});

$('pipeSel').onchange=e=>{qs.set('pipeline',e.target.value);location.search=qs.toString()};
$('lang').onclick=()=>{LANG=LANG==='en'?'id':'en';localStorage.setItem('ja-lang',LANG);qs.set('lang',LANG);history.replaceState(null,'','?'+qs.toString());location.reload()};
$('runSel').onchange=e=>{shown=e.target.value||null;liveRender()};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;flt.k=b.dataset.k;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));renderLog()};
$('q').oninput=e=>{flt.q=e.target.value.trim().toLowerCase();renderLog()};
$('play').onclick=()=>{const r=current();if(!r)return;clearInterval(replayT);
 const list=r.events,S=newState(list[0].ts);let k=0;$('play').textContent=T('replaying');
 replayT=setInterval(()=>{if(k>=list.length){clearInterval(replayT);replayT=null;$('play').textContent=T('replay');liveRender();return}
  apply(S,list[k]);k++;render(S,list.slice(0,k));$('sT').textContent=fmt(list[k-1].ts-list[0].ts)},700)};
$('pres').onclick=()=>{document.body.classList.toggle('present');texts()};
</script></body></html>
